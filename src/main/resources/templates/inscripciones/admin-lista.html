<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Inscripciones - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/perfil-dashboard.css}">
</head>
<body class="bg-light">

<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="main-content">
    <div th:replace="fragments/header :: header"></div>

    <div class="container-fluid p-3 p-md-4">

        <!-- Cabecera Responsiva -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
            <div>
                <h2 class="fw-bold text-navy mb-1"><i class="bi bi-cash-coin me-2 text-primary"></i>Gestión de Inscripciones</h2>
                <p class="text-muted small mb-0">Seleccione o busque un cliente para ver su historial de pagos y registrar abonos.</p>
            </div>
        </div>

        <!-- Buscador Dinámico en Tiempo Real -->
        <div class="card border-0 shadow-sm rounded-4 p-3 p-md-4 bg-white mb-4">
            <div class="row align-items-center">
                <div class="col-12">
                    <label for="inputBuscador" class="form-label fw-bold text-secondary small text-uppercase mb-2">
                        <i class="bi bi-search me-2"></i>Buscar Cliente (Nombre, DNI o Teléfono)
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-person-lines-fill"></i></span>
                        <input type="text" id="inputBuscador" class="form-control" placeholder="Escriba el nombre, DNI o teléfono del cliente...">
                    </div>
                </div>
            </div>
        </div>

        <!-- Listado de Clientes -->
        <div class="card border-0 shadow-sm rounded-4 p-3 p-md-4 bg-white">
            <h5 class="fw-bold mb-3 text-secondary"><i class="bi bi-people me-2"></i>Lista de Clientes</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="tablaClientes">
                    <thead class="table-light small text-uppercase text-muted">
                    <tr>
                        <th class="py-3">Cliente</th>
                        <th class="py-3">DNI</th>
                        <th class="py-3">Teléfono</th>
                        <th class="text-center py-3">Acción</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${usuarios}" class="fila-cliente">
                        <td class="py-3">
                            <div class="d-flex align-items-center">
                                <img th:src="${u.fotoUrl}" class="rounded-circle me-2 flex-shrink-0 border border-2 border-light shadow-sm" style="width: 38px; height: 38px; object-fit: cover;" alt="">
                                <span class="fw-semibold text-dark nombre-cliente text-truncate" style="max-width: 180px;" th:text="${u.nombre + ' ' + u.apellido}"></span>
                            </div>
                        </td>
                        <td class="py-3"><span class="dni-cliente text-secondary fw-medium" th:text="${u.dni != null ? u.dni : 'N/D'}"></span></td>
                        <td class="py-3"><span class="telefono-cliente text-secondary fw-medium" th:text="${u.telefono != null ? u.telefono : 'N/D'}"></span></td>
                        <td class="text-center py-3">
                            <a th:href="@{'/inscripciones/cliente/' + ${u.id}}" class="btn btn-sm btn-primary rounded-pill px-3 shadow-sm text-nowrap">
                                <i class="bi bi-eye me-1"></i> Ver y Realizar Pagos
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('inputBuscador').addEventListener('keyup', function() {
        let filtro = this.value.toLowerCase().trim();
        let filas = document.querySelectorAll('.fila-cliente');

        filas.forEach(fila => {
            let nombre = fila.querySelector('.nombre-cliente').textContent.toLowerCase();
            let dni = fila.querySelector('.dni-cliente').textContent.toLowerCase();
            let telefono = fila.querySelector('.telefono-cliente').textContent.toLowerCase();

            if (nombre.includes(filtro) || dni.includes(filtro) || telefono.includes(filtro)) {
                fila.style.display = '';
            } else {
                fila.style.display = 'none';
            }
        });
    });
</script>
</body>
</html>
