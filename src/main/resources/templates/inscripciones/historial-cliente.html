<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Pagos - Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/perfil-dashboard.css}">
</head>
<body class="bg-light">

<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="main-content">
    <div th:replace="fragments/header :: header"></div>

    <div class="container-fluid p-3 p-md-4">

        <!-- Cabecera Responsiva -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
            <div>
                <h2 class="fw-bold text-navy mb-1"><i class="bi bi-clock-history me-2 text-primary"></i>Pagos del Cliente</h2>
                <p class="text-muted small mb-0">Cliente: <strong th:text="${cliente.nombre + ' ' + cliente.apellido}"></strong> | DNI: <strong th:text="${cliente.dni}"></strong></p>
            </div>
            <div>
                <a th:href="@{/inscripciones}" class="btn btn-outline-secondary rounded-pill px-3 shadow-sm text-nowrap">
                    <i class="bi bi-arrow-left me-1"></i> Volver a la Lista
                </a>
            </div>
        </div>

        <!-- Alertas -->
        <div th:if="${exito}" class="alert alert-success alert-dismissible fade show shadow-sm rounded-3" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${exito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm rounded-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Tarjeta de Acciones de Cobro para este cliente -->
        <div class="card border-0 shadow-sm rounded-4 p-3 p-md-4 bg-white mb-4">
            <h5 class="fw-bold mb-3 text-secondary"><i class="bi bi-plus-circle-fill me-2"></i>Registrar Nuevo Pago o Abono</h5>
            <div class="row g-3 align-items-center">
                <!-- Abono Parcial -->
                <div class="col-12 col-lg-6">
                    <form th:action="@{/inscripciones/admin/abonar}" method="post" class="d-flex flex-wrap gap-2 align-items-center">
                        <input type="hidden" name="usuarioId" th:value="${cliente.id}"/>
                        <div class="input-group flex-grow-1 flex-sm-grow-0" style="max-width: 220px;">
                            <span class="input-group-text bg-light text-muted">S/.</span>
                            <input type="number" step="0.5" min="0.5" name="monto" class="form-control" placeholder="Monto ej. 10" required />
                        </div>
                        <button type="submit" class="btn btn-outline-primary text-nowrap shadow-sm">
                            <i class="bi bi-plus-circle me-1"></i> Agregar Abono
                        </button>
                    </form>
                </div>
                <!-- Pago Completo -->
                <div class="col-12 col-lg-6 text-lg-end" th:unless="${tieneAbonoParcial}">
                    <form th:action="@{/inscripciones/admin/pagar-completo}" method="post" class="d-inline w-150">
                        <input type="hidden" name="usuarioId" th:value="${cliente.id}"/>
                        <button type="submit" class="btn btn-success text-nowrap shadow-sm w-100 w-lg-auto" onclick="return confirm('¿Marcar los 40 soles como pagados para este periodo?');">
                            <i class="bi bi-check-all me-1"></i> Pagar Completo
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Listado de Historial de Inscripciones de este Cliente -->
        <div class="card border-0 shadow-sm rounded-4 p-3 p-md-4 bg-white">
            <h5 class="fw-bold mb-3 text-secondary"><i class="bi bi-journal-check me-2"></i>Registros de Inscripción</h5>
            <div class="table-responsive">
                <table class="table table-striped align-middle mb-0">
                    <thead class="table-light small text-uppercase text-muted">
                    <tr>
                        <th class="py-3">Periodo (Mes)</th>
                        <th class="py-3">Pagado / Meta</th>
                        <th class="py-3">Fecha de Pago</th>
                        <th class="text-center py-3">Estado</th>
                        <th class="text-center py-3">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(inscripciones)}">
                        <td colspan="5" class="text-center text-muted py-4">Este cliente aún no registra pagos ni abonos.</td>
                    </tr>
                    <tr th:each="ins : ${inscripciones}">
                        <td class="py-3"><span class="badge bg-light text-dark border px-2 py-1" th:text="${ins.periodoMes}"></span></td>
                        <td class="py-3" style="min-width: 150px;">
                            <div class="fw-bold text-dark small" th:text="${'S/. ' + ins.montoPagado + ' / S/. ' + ins.montoTotal}"></div>
                            <div class="progress mt-1 rounded-pill" style="height: 6px;">
                                <div class="progress-bar bg-success" role="progressbar"
                                     th:style="${'width: ' + (ins.montoPagado * 100 / ins.montoTotal) + '%'}"
                                     th:aria-valuenow="${ins.montoPagado}" aria-valuemin="0" aria-valuemax="40"></div>
                            </div>
                        </td>
                        <td class="py-3 text-muted small" th:text="${ins.fechaPago != null ? ins.fechaPago : 'Pendiente / En proceso'}"></td>
                        <td class="text-center py-3">
                            <span class="badge px-3 py-2 rounded-pill text-nowrap"
                                  th:text="${ins.activo ? 'COMPLETADO' : 'EN PROCESO'}"
                                  th:classappend="${ins.activo ? 'bg-success-subtle text-success' : 'bg-warning-subtle text-warning'}"></span>
                        </td>
                        <td class="text-center py-3">
                            <form th:action="@{/inscripciones/admin/eliminar}" method="post" class="d-inline">
                                <input type="hidden" name="id" th:value="${ins.id}"/>
                                <input type="hidden" name="usuarioId" th:value="${cliente.id}"/>
                                <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3 shadow-sm text-nowrap" onclick="return confirm('¿Estás seguro de eliminar este registro de pago?');">
                                    <i class="bi bi-trash me-1"></i> Eliminar
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
