<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Comprar Membresía - Voley Control</title>
    <link rel="icon" type="image/png" th:href="@{/img/logo.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/perfil-dashboard.css}">
</head>
<body class="bg-light">

<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="main-content">
    <div th:replace="fragments/header :: header"></div>

    <div class="container-fluid p-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-navy mb-1"><i class="bi bi-credit-card-2-front me-2"></i>Pasarela de Pago</h2>
                <p class="text-muted mb-0">Adquisición y renovación de tu membresía anual en la plataforma.</p>
            </div>
            <div>
                <a th:href="@{/membresias}" class="btn btn-outline-secondary rounded-pill px-3 shadow-sm">
                    <i class="bi bi-arrow-left me-1"></i> Volver a Membresía
                </a>
            </div>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm rounded-4 mb-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-7 col-xl-6">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden bg-white">

                    <div class="card-header bg-navy text-white p-4 text-center">
                        <div class="mb-2">
                            <i class="bi bi-shield-lock-fill fs-1 text-white"></i>
                        </div>
                        <h4 class="mb-1 fw-bold">Resumen de Pago</h4>
                        <p class="text-gray-light mb-0 small">Membresía Anual del Sistema</p>
                    </div>

                    <div class="card-body p-4 p-md-5">

                        <form th:action="@{/membresias/comprar}" method="post">

                            <div class="p-4 bg-light rounded-4 mb-4 border">
                                <h5 class="fw-bold text-navy mb-3"><i class="bi bi-receipt me-2"></i>Detalle de Transacción</h5>

                                <div class="mb-3 d-flex justify-content-between align-items-center">
                                    <span class="text-muted fw-semibold">Concepto:</span>
                                    <span class="fw-bold text-dark">Membresía Anual del Sistema</span>
                                </div>

                                <div class="mb-3 d-flex justify-content-between align-items-center">
                                    <span class="text-muted fw-semibold">Vigencia:</span>
                                    <span class="fw-semibold text-secondary">Hasta los últimos días del año actual</span>
                                </div>

                                <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                                    <span class="text-muted fw-semibold">Costo Fijo:</span>
                                    <span class="fs-4 fw-bold text-success" th:text="${'S/. ' + costoAnual}">S/. 60.0</span>
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-success rounded-pill py-3 fw-bold shadow-sm text-white">
                                    <i class="bi bi-check-circle-fill me-2"></i> Confirmar Pago y Adquirir Membresía
                                </button>
                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/perfil-dashboard.js}"></script>
</body>
</html>
