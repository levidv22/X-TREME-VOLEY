<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Header</title>
</head>
<body>
<header th:fragment="header" class="navbar navbar-expand bg-white px-3 px-md-4 py-2 custom-header w-100 sticky-top">
    <div class="container-fluid px-0 d-flex align-items-center justify-content-between">

        <!-- Lado Izquierdo: Hamburguesa + Logo + Rango -->
        <div class="d-flex align-items-center gap-2 gap-md-3">
            <!-- Botón Hamburguesa Móvil -->
            <button class="btn btn-icon d-lg-none border-0 text-navy p-2 d-flex align-items-center justify-content-center" type="button" id="sidebarToggle" aria-label="Abrir Menú">
                <i class="bi bi-list fs-3"></i>
            </button>

            <!-- Logo con Animación -->
            <a class="navbar-brand d-flex align-items-center me-1 me-md-2 p-0 text-decoration-none logo-wrapper" th:href="@{/usuarios/perfil}">
                <img th:src="@{/img/logo.png}" alt="Logo X-TREME" class="header-logo object-fit-contain" />
            </a>

            <!-- Separador Vertical -->
            <div class="vr d-none d-md-block my-auto text-secondary opacity-25" style="height: 28px;"></div>

            <!-- Insignia / Rango -->
            <div class="d-flex align-items-center gap-2 ms-sm-1">
                <span class="text-uppercase text-muted small fw-bold tracking-wider d-none d-md-inline" style="font-size: 0.75rem;">Rango:</span>
                <div class="badge-rank-wrapper">
                    <span class="badge badge-glow px-3 py-2 rounded-pill fw-bold text-uppercase" th:text="${session.usuarioLogueado.rangoActual}">RANGO</span>
                </div>
            </div>
        </div>

        <!-- Lado Derecho: Campanita + Menú de Usuario -->
        <div class="d-flex align-items-center gap-2 gap-sm-3">

            <!-- Campanita de Notificaciones (Solo Admin) -->
            <div class="position-relative" th:if="${session.usuarioLogueado != null && session.usuarioLogueado.rol.name() == 'ADMIN'}">
                <a th:href="@{/notificaciones}" class="btn-notification-bell position-relative d-flex align-items-center justify-content-center" aria-label="Notificaciones">
                    <i class="bi bi-bell-fill fs-5 text-navy"></i>
                    <!-- Badge Flotante Animado -->
                    <span th:if="${conteoNotificacionesNoLeidas > 0}"
                          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border border-2 border-white notification-badge-pulse"
                          th:text="${conteoNotificacionesNoLeidas}">
                        0
                    </span>
                </a>
            </div>

            <!-- Menú Dropdown del Usuario -->
            <div class="dropdown">
                <button class="btn user-dropdown-btn d-flex align-items-center gap-2 p-1 pe-2 rounded-pill transition-all" type="button" id="userMenuDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <div class="avatar-status-wrapper">
                        <img th:src="${session.usuarioLogueado.fotoUrl != null && !session.usuarioLogueado.fotoUrl.isEmpty() ? session.usuarioLogueado.fotoUrl : '/img/default.jpg'}"
                             alt="Avatar"
                             class="rounded-circle header-avatar shadow-sm" width="40" height="40" />
                        <span class="status-indicator"></span>
                    </div>
                    <div class="text-start d-none d-sm-block lh-sm">
                        <span class="d-block fw-bold text-navy text-truncate style-name" style="max-width: 140px;" th:text="${session.usuarioLogueado.nombre + ' ' + session.usuarioLogueado.apellido}">Nombre Apellido</span>
                        <span class="d-block text-muted text-truncate style-email" style="max-width: 140px;" th:text="${session.usuarioLogueado.email}">correo@ejemplo.com</span>
                    </div>
                    <i class="bi bi-chevron-down fs-7 text-muted ms-1 d-none d-sm-inline dropdown-arrow"></i>
                </button>

                <!-- Menú Desplegable Mejorado -->
                <div class="dropdown-menu dropdown-menu-end shadow-premium border-0 p-3 rounded-4 mt-2 animate-dropdown" aria-labelledby="userMenuDropdown" style="min-width: 280px; max-width: 90vw;">
                    <!-- Cabecera de Menú -->
                    <div class="d-flex align-items-center gap-3 mb-3 pb-3 border-bottom border-light-subtle">
                        <div class="position-relative">
                            <img th:src="${session.usuarioLogueado.fotoUrl != null && !session.usuarioLogueado.fotoUrl.isEmpty() ? session.usuarioLogueado.fotoUrl : '/img/default.jpg'}"
                                 alt="Avatar"
                                 class="rounded-circle shadow-sm" width="52" height="52" style="object-fit: cover;" />
                        </div>
                        <div class="overflow-hidden">
                            <h6 class="mb-0 fw-bold text-navy text-truncate" th:text="${session.usuarioLogueado.nombre + ' ' + session.usuarioLogueado.apellido}"></h6>
                            <span class="badge bg-light text-navy border border-navy-subtle fw-semibold mt-1" th:text="${session.usuarioLogueado.rol}">ROL</span>
                        </div>
                    </div>

                    <!-- Datos del Usuario -->
                    <div class="user-info-list mb-3 d-flex flex-column gap-2">
                        <div class="info-item d-flex align-items-center gap-2 text-muted small">
                            <div class="icon-box"><i class="bi bi-envelope text-navy"></i></div>
                            <span class="text-truncate" th:text="${session.usuarioLogueado.email}"></span>
                        </div>
                        <div class="info-item d-flex align-items-center gap-2 text-muted small">
                            <div class="icon-box"><i class="bi bi-telephone text-navy"></i></div>
                            <span th:text="${session.usuarioLogueado.telefono != null && !session.usuarioLogueado.telefono.isEmpty() ? session.usuarioLogueado.telefono : 'No registrado'}"></span>
                        </div>
                        <div class="info-item d-flex align-items-center gap-2 text-muted small">
                            <div class="icon-box"><i class="bi bi-card-heading text-navy"></i></div>
                            <span>DNI: <strong class="text-dark" th:text="${session.usuarioLogueado.dni}"></strong></span>
                        </div>
                    </div>

                    <div class="dropdown-divider my-2"></div>

                    <!-- Botón de Cerrar Sesión -->
                    <a class="dropdown-item dropdown-logout-btn d-flex align-items-center gap-2 rounded-3 py-2 px-3 fw-semibold text-danger transition-all" th:href="@{/usuarios/logout}">
                        <i class="bi bi-box-arrow-left fs-5"></i>
                        <span>Cerrar Sesión</span>
                    </a>
                </div>
            </div>
        </div>

    </div>
</header>
</body>
</html>
