<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Header</title>
</head>
<body>
<header th:fragment="header" class="navbar navbar-expand navbar-light bg-white px-3 px-md-4 py-3 shadow-sm custom-header">
    <div class="container-fluid px-0">
        <div class="d-flex align-items-center gap-2 gap-md-3">
            <!-- Botón hamburguesa para activar sidebar en móviles -->
            <button class="btn btn-light d-lg-none border-0 p-2 shadow-none text-navy" type="button" id="sidebarToggle" aria-label="Abrir Menú">
                <i class="bi bi-list fs-4"></i>
            </button>

            <div class="d-flex align-items-center gap-2">
                <span class="text-muted small fw-semibold text-uppercase tracking-wider d-none d-sm-inline">Rango Actual:</span>
                <span class="badge bg-navy px-3 py-2 rounded-pill fw-bold" th:text="${session.usuarioLogueado.rangoActual}">RANGO</span>
            </div>
        </div>

        <div class="dropdown">
            <button class="btn btn-light dropdown-toggle d-flex align-items-center gap-2 border-0 bg-transparent shadow-none" type="button" id="userMenuDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                <div class="text-end d-none d-sm-block">
                    <span class="d-block fw-bold text-navy text-truncate" style="max-width: 150px;" th:text="${session.usuarioLogueado.nombre + ' ' + session.usuarioLogueado.apellido}">Nombre Apellido</span>
                    <span class="d-block text-muted small text-truncate" style="max-width: 150px;" th:text="${session.usuarioLogueado.email}">correo@ejemplo.com</span>
                </div>
                <img th:src="${session.usuarioLogueado.fotoUrl != null && !session.usuarioLogueado.fotoUrl.isEmpty() ? session.usuarioLogueado.fotoUrl : '/img/default.jpg'}"
                     alt="Avatar"
                     class="rounded-circle border" width="40" height="40" style="object-fit: cover;" />
            </button>
            <div class="dropdown-menu dropdown-menu-end shadow-lg border-0 p-3 rounded-4 mt-2" aria-labelledby="userMenuDropdown" style="min-width: 260px; max-width: 90vw;">
                <div class="d-flex align-items-center gap-3 mb-3 pb-3 border-bottom">
                    <img th:src="${session.usuarioLogueado.fotoUrl != null && !session.usuarioLogueado.fotoUrl.isEmpty() ? session.usuarioLogueado.fotoUrl : '/img/default.jpg'}"
                         alt="Avatar"
                         class="rounded-circle" width="48" height="48" style="object-fit: cover;" />
                    <div class="overflow-hidden">
                        <h6 class="mb-0 fw-bold text-navy text-truncate" th:text="${session.usuarioLogueado.nombre + ' ' + session.usuarioLogueado.apellido}"></h6>
                        <small class="text-muted" th:text="${session.usuarioLogueado.rol}"></small>
                    </div>
                </div>
                <div class="mb-2">
                    <p class="mb-1 small text-muted text-truncate"><i class="bi bi-envelope me-2 text-navy"></i><strong class="text-dark">Correo:</strong> <span th:text="${session.usuarioLogueado.email}"></span></p>
                    <p class="mb-1 small text-muted"><i class="bi bi-telephone me-2 text-navy"></i><strong class="text-dark">Teléfono:</strong> <span th:text="${session.usuarioLogueado.telefono != null && !session.usuarioLogueado.telefono.isEmpty() ? session.usuarioLogueado.telefono : 'No registrado'}"></span></p>
                    <p class="mb-0 small text-muted"><i class="bi bi-card-heading me-2 text-navy"></i><strong class="text-dark">DNI:</strong> <span th:text="${session.usuarioLogueado.dni}"></span></p>
                </div>
                <div class="dropdown-divider my-3"></div>
                <a class="dropdown-item text-danger d-flex align-items-center gap-2 rounded-2 py-2 px-2 fw-semibold" th:href="@{/usuarios/logout}">
                    <i class="bi bi-box-arrow-left"></i> Cerrar Sesión
                </a>
            </div>
        </div>
    </div>
</header>
</body>
</html>
