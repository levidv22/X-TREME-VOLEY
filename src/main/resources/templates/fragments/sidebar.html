<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sidebar</title>
</head>
<body>
<!-- Backdrop para móviles -->
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<nav th:fragment="sidebar" class="sidebar-container bg-navy text-white d-flex flex-column p-3" id="sidebarMenu">

    <!-- Botón de Cierre Superior (Separado de la foto para evitar clics accidentales) -->
    <div class="d-flex justify-content-end d-lg-none mb-1">
        <button class="btn btn-sm text-white-50 border-0 shadow-none p-1" id="sidebarClose" aria-label="Cerrar menú">
            <i class="bi bi-x-lg fs-4"></i>
        </button>
    </div>

    <!-- Cabecera de Perfil -->
    <div class="text-center pb-4 pt-2 border-bottom border-navy-light mb-3">
        <a th:href="@{/usuarios/editar/{id}(id=${session.usuarioLogueado.id})}" class="sidebar-avatar-wrapper text-decoration-none d-block position-relative">
            <div class="avatar-container mx-auto">
                <img th:src="${session.usuarioLogueado.fotoUrl != null && !session.usuarioLogueado.fotoUrl.isEmpty() ? session.usuarioLogueado.fotoUrl : '/img/default.jpg'}"
                     alt="Foto de perfil"
                     class="rounded-circle shadow-lg sidebar-avatar" />
                <div class="avatar-overlay rounded-circle d-flex align-items-center justify-content-center">
                    <i class="bi bi-pencil-fill text-white fs-4"></i>
                </div>
            </div>
        </a>
        <h5 class="mt-3 mb-0 fw-bold text-white text-truncate px-2" th:text="${session.usuarioLogueado.nombre}"></h5>
        <span class="badge bg-secondary-navy text-light mt-1 small" th:text="${session.usuarioLogueado.rol}">Rol</span>
    </div>

    <ul class="nav nav-pills flex-column mb-auto gap-2">
        <li class="nav-item">
            <a th:href="@{/usuarios/perfil}" class="nav-link text-white-50 d-flex align-items-center gap-3 py-2 px-3 rounded-3 sidebar-link">
                <i class="bi bi-speedometer2 fs-5"></i> Mi Perfil
            </a>
        </li>

        <!-- MENÚ DESPLEGABLE DE AFILIADOS -->
        <li class="nav-item">
            <a class="nav-link text-white-50 d-flex align-items-center justify-content-between py-2 px-3 rounded-3"
               data-bs-toggle="collapse"
               href="#menuAfiliados"
               role="button"
               aria-expanded="false"
               aria-controls="menuAfiliados"
               id="dropdownAfiliados">
                <div class="d-flex align-items-center gap-3">
                    <i class="bi bi-diagram-3 fs-5"></i> Afiliados
                </div>
                <i class="bi bi-chevron-down small"></i>
            </a>
            <!-- Submenú colapsable -->
            <div class="collapse mt-1 ps-4" id="menuAfiliados">
                <ul class="nav flex-column gap-1">
                    <li>
                        <a th:href="@{/red-afiliados/nivel-1}" class="nav-link text-white-50 d-flex align-items-center gap-2 py-2 px-3 rounded-3 small sidebar-link">
                            <i class="bi bi-people fs-6"></i> Referidos Directos
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/red-afiliados}" class="nav-link text-white-50 d-flex align-items-center gap-2 py-2 px-3 rounded-3 small sidebar-link">
                            <i class="bi bi-diagram-2 fs-6"></i> Vista de Árbol
                        </a>
                    </li>
                </ul>
            </div>
        </li>

        <li class="nav-item" th:if="${session.usuarioLogueado != null and session.usuarioLogueado.rol.name() == 'ADMIN'}">
            <a th:href="@{/inscripciones}" class="nav-link text-white-50 d-flex align-items-center gap-3 py-2 px-3 rounded-3 sidebar-link">
                <i class="bi bi-calendar-check fs-5"></i> Inscripción
            </a>
        </li>

        <li class="nav-item">
            <a th:href="@{/puntos-bonos}" class="nav-link text-white-50 d-flex align-items-center gap-3 py-2 px-3 rounded-3 sidebar-link">
                <i class="bi bi-star fs-5"></i> Puntos y Bonos
            </a>
        </li>
    </ul>

    <div class="mt-auto pt-3 border-top border-navy-light">
        <a th:href="@{/usuarios/logout}" class="nav-link text-danger d-flex align-items-center gap-3 py-2 px-3 rounded-3 logout-link">
            <i class="bi bi-box-arrow-left fs-5"></i> Cerrar Sesión
        </a>
    </div>

    <!-- Script Integrado para Control Responsivo y Cierre Externo -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const sidebarToggle = document.getElementById("sidebarToggle");
            const sidebarClose = document.getElementById("sidebarClose");
            const sidebarMenu = document.getElementById("sidebarMenu");
            const sidebarBackdrop = document.getElementById("sidebarBackdrop");

            function toggleSidebar() {
                sidebarMenu.classList.toggle("mobile-show");
                sidebarBackdrop.classList.toggle("show");
            }

            function closeSidebar() {
                sidebarMenu.classList.remove("mobile-show");
                sidebarBackdrop.classList.remove("show");
            }

            if (sidebarToggle) sidebarToggle.addEventListener("click", toggleSidebar);
            if (sidebarClose) sidebarClose.addEventListener("click", toggleSidebar);
            if (sidebarBackdrop) sidebarBackdrop.addEventListener("click", closeSidebar);

            // Cerrar el sidebar al hacer clic fuera de él en dispositivos móviles
            document.addEventListener("click", function (event) {
                if (window.innerWidth <= 992) {
                    const isClickInsideSidebar = sidebarMenu.contains(event.target);
                    const isClickOnToggle = sidebarToggle && sidebarToggle.contains(event.target);

                    if (!isClickInsideSidebar && !isClickOnToggle && sidebarMenu.classList.contains("mobile-show")) {
                        closeSidebar();
                    }
                }
            });

            // Detección automática de ruta activa
            const rutaActual = window.location.pathname;
            const enlaces = document.querySelectorAll(".sidebar-link");

            const enlacesOrdenados = Array.from(enlaces).sort((a, b) => {
                const urlA = new URL(a.href, window.location.origin).pathname;
                const urlB = new URL(b.href, window.location.origin).pathname;
                return urlB.length - urlA.length;
            });

            let encontrado = false;

            enlacesOrdenados.forEach(enlace => {
                if (encontrado) return;

                const urlEnlace = new URL(enlace.href, window.location.origin).pathname;
                const esCoincidenciaExacta = (rutaActual === urlEnlace);
                const esSubRutaValida = (urlEnlace !== '/' && rutaActual.startsWith(urlEnlace + '/'));

                if (esCoincidenciaExacta || esSubRutaValida) {
                    enlace.classList.add("active-link");
                    enlace.classList.remove("text-white-50");
                    encontrado = true;

                    const collapseParent = enlace.closest(".collapse");
                    if (collapseParent) {
                        collapseParent.classList.add("show");
                        const dropdownToggle = document.querySelector(`[href="#${collapseParent.id}"]`);
                        if (dropdownToggle) {
                            dropdownToggle.classList.add("active-link", "text-white");
                            dropdownToggle.classList.remove("text-white-50");
                            dropdownToggle.setAttribute("aria-expanded", "true");
                        }
                    }
                }
            });
        });
    </script>
</nav>
</body>
</html>
