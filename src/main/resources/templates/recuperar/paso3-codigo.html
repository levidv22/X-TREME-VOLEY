<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar Código - Voley Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <style>
        /* Estilo para espaciado ancho de los 4 dígitos del PIN */
        .input-pin {
            letter-spacing: 0.5rem;
            font-size: 1.75rem;
            font-weight: 700;
        }
    </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-3 py-md-5">

<div class="container">
    <div class="row justify-content-center align-items-center">
        <!-- Misma retícula responsiva que el login para consistencia exacta -->
        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-4">

            <div class="card shadow-lg border-0 rounded-4 overflow-hidden animate-fade-in w-100">

                <!-- Header estilo Navy con icono central -->
                <div class="card-header bg-navy text-white p-4 text-center">
                    <div class="mb-2">
                        <i class="bi bi-shield-check fs-1 text-white"></i>
                    </div>
                    <h3 class="mb-1 fw-bold fs-3">Verificación</h3>
                    <p class="text-gray-light mb-0 small">Ingresa el código enviado a tu correo</p>
                </div>

                <div class="card-body p-3 p-sm-4 p-md-5 bg-white">

                    <!-- Alert dinámico idéntico al login -->
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show text-center py-2 mb-3 shadow-sm rounded-3 small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${error}"></span>
                        <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <p class="text-muted text-center small mb-4">
                        El código consta de <strong>4 dígitos</strong> y expira en <strong>5 minutos</strong>.
                    </p>

                    <form th:action="@{/recuperar/validar-codigo}" method="post" class="needs-validation" novalidate>

                        <!-- Input del PIN centrado -->
                        <div class="mb-4">
                            <label for="codigo" class="form-label fw-semibold text-navy small text-center w-100">Código de Verificación</label>
                            <div class="input-group">
                                <span class="input-group-text bg-gray-light border-end-0 px-3">
                                    <i class="bi bi-key-fill text-navy"></i>
                                </span>
                                <input type="text"
                                       id="codigo"
                                       name="codigo"
                                       maxlength="4"
                                       pattern="[0-9]{4}"
                                       class="form-control border-start-0 shadow-none py-2 text-center input-pin text-navy"
                                       placeholder="••••"
                                       required
                                       autofocus
                                       autocomplete="off" />
                            </div>
                        </div>

                        <!-- Botón estilo Navy con icono -->
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-navy py-2.5 rounded-pill fw-semibold text-white shadow-sm">
                                <i class="bi bi-check-circle-fill me-1"></i> Verificar Código
                            </button>
                        </div>

                    </form>

                    <!-- Footer para solicitar nuevo código o volver -->
                    <div class="text-center mt-4 pt-3 border-top">
                        <p class="text-muted small mb-0">
                            ¿No recibiste el código?
                            <a th:href="@{/recuperar/opciones}" class="text-navy fw-semibold text-decoration-none">Reenviar</a>
                        </p>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
