<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente - Email</title>
    <link rel="icon" type="image/png" th:href="@{/img/logo.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-3 py-md-5">

<div class="container">
    <div class="row justify-content-center align-items-center">
        <!-- Retícula responsiva idéntica a la vista de Login -->
        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-4">

            <div class="card shadow-lg border-0 rounded-4 overflow-hidden animate-fade-in w-100">

                <!-- Header estilo Navy con icono central -->
                <div class="card-header bg-navy text-white p-4 text-center">
                    <div class="mb-2">
                        <i class="bi bi-envelope-check-fill fs-1 text-white"></i>
                    </div>
                    <h3 class="mb-1 fw-bold fs-3">Enviar Código</h3>
                    <p class="text-gray-light mb-0 small">Confirmación de correo electrónico</p>
                </div>

                <div class="card-body p-3 p-sm-4 p-md-5 bg-white">

                    <!-- Alert dinámico estandarizado -->
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show text-center py-2 mb-3 shadow-sm rounded-3 small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${error}"></span>
                        <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <p class="text-muted text-center small mb-3">
                        Enviaremos un código de seguridad de 4 dígitos al siguiente correo registrado:
                    </p>

                    <!-- Tarjeta para mostrar el correo enmascarado con estilos Navy y Gray-Light -->
                    <div class="p-3 border rounded-3 bg-gray-light text-center mb-4">
                        <i class="bi bi-envelope-at fs-2 text-navy"></i>
                        <div class="fw-bold fs-6 mt-1 text-navy" th:text="${emailOculto}">usuario****@gmail.com</div>
                    </div>

                    <form th:action="@{/recuperar/enviar-codigo}" method="post">
                        <!-- Botón Navy con pill radius, sombra y hover -->
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-navy py-2.5 rounded-pill fw-semibold text-white shadow-sm">
                                <i class="bi bi-send-fill me-1"></i> Enviar Código
                            </button>
                        </div>
                    </form>

                    <!-- Footer con enlace estilizado -->
                    <div class="text-center mt-4 pt-3 border-top">
                        <a th:href="@{/recuperar}" class="text-navy fw-semibold text-decoration-none small">
                            <i class="bi bi-arrow-left me-1"></i> Volver e ingresar otro DNI
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
