<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente - DNI</title>
    <link rel="icon" type="image/png" th:href="@{/img/logo.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-3 py-md-5">

<div class="container">
    <div class="row justify-content-center align-items-center">
        <!-- Misma retícula responsiva que el login para consistencia exacta -->
        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-4">

            <div class="card shadow-lg border-0 rounded-4 overflow-hidden animate-fade-in w-100">

                <!-- Header estilo Navy con icono central -->
                <div class="card-header bg-navy text-white p-4 text-center">
                    <div class="mb-2">
                        <i class="bi bi-person-vcard-fill fs-1 text-white"></i>
                    </div>
                    <h3 class="mb-1 fw-bold fs-3">Recuperar Clave</h3>
                    <p class="text-gray-light mb-0 small">Ingresa tu DNI para validar tu identidad</p>
                </div>

                <div class="card-body p-3 p-sm-4 p-md-5 bg-white">

                    <!-- Alert dinámico idéntico al login -->
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show text-center py-2 mb-3 shadow-sm rounded-3 small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${error}"></span>
                        <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/recuperar/validar-dni}" method="post" class="needs-validation" novalidate>

                        <!-- Input con input-group estilizado e icono -->
                        <div class="mb-4">
                            <label for="dni" class="form-label fw-semibold text-navy small">Número de DNI</label>
                            <div class="input-group">
                                <span class="input-group-text bg-gray-light border-end-0 px-3">
                                    <i class="bi bi-card-text text-navy"></i>
                                </span>
                                <input type="text"
                                       id="dni"
                                       name="dni"
                                       maxlength="8"
                                       pattern="[0-9]{8}"
                                       class="form-control border-start-0 shadow-none py-2"
                                       placeholder="Ingresa tu DNI (8 dígitos)"
                                       required
                                       autofocus />
                            </div>
                        </div>

                        <!-- Botón estilo Navy con icono y bordes redondeados -->
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-navy py-2.5 rounded-pill fw-semibold text-white shadow-sm">
                                <i class="bi bi-arrow-right-circle me-1"></i> Continuar
                            </button>
                        </div>

                    </form>

                    <!-- Footer con enlace para volver al Login -->
                    <div class="text-center mt-4 pt-3 border-top">
                        <p class="text-muted small mb-0">
                            ¿Recordaste tu contraseña? <a th:href="@{/usuarios/login}" class="text-navy fw-semibold text-decoration-none">Iniciar Sesión</a>
                        </p>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
