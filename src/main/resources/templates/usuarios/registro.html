<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - Voley Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="bg-light d-flex align-items-start align-items-md-center justify-content-center min-vh-100 py-3 py-md-5">

<div class="container">
    <div class="row justify-content-center align-items-center">
        <!-- Rejilla optimizada para ocupar el ancho perfecto en móviles, tablets y PCs -->
        <div class="col-12 col-sm-11 col-md-10 col-lg-8 col-xl-7">

            <div class="card shadow-lg border-0 rounded-4 overflow-hidden animate-fade-in w-100">

                <div class="card-header bg-navy text-white p-4 text-center">
                    <div class="mb-2">
                        <i class="bi bi-person-plus-fill fs-1 text-white"></i>
                    </div>
                    <h3 class="mb-1 fw-bold fs-3">Crear Cuenta</h3>
                    <p class="text-gray-light mb-0 small">Regístrate para acceder a Voley Control</p>
                </div>

                <div class="card-body p-3 p-sm-4 p-md-5 bg-white">

                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show text-center py-2 mb-3 shadow-sm rounded-3 small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${error}"></span>
                        <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show text-center py-2 mb-3 shadow-sm rounded-3 small" role="alert">
                        <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${exito}"></span>
                        <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/usuarios/registro}" th:object="${usuario}" method="post" enctype="multipart/form-data" class="needs-validation" novalidate>

                        <div class="mb-3" th:if="${!esPrimerUsuario}">
                            <label for="codigoReferidoIngresado" class="form-label fw-semibold text-navy small">Código de Referido</label>
                            <div class="input-group">
                                <span class="input-group-text bg-gray-light border-end-0 px-3"><i class="bi bi-ticket-perforated text-navy"></i></span>
                                <input type="text" id="codigoReferidoIngresado" name="codigoReferidoIngresado" th:value="${codigoPrecargado}" class="form-control border-start-0 shadow-none py-2" placeholder="Ingresa el código de tu patrocinador" required />
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-12 col-md-6 mb-3">
                                <label for="nombre" class="form-label fw-semibold text-navy small">Nombre</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-gray-light border-end-0 px-3"><i class="bi bi-person text-navy"></i></span>
                                    <input type="text" id="nombre" th:field="*{nombre}" class="form-control border-start-0 shadow-none py-2" placeholder="Tu nombre" required />
                                </div>
                            </div>

                            <div class="col-12 col-md-6 mb-3">
                                <label for="apellido" class="form-label fw-semibold text-navy small">Apellido</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-gray-light border-end-0 px-3"><i class="bi bi-person text-navy"></i></span>
                                    <input type="text" id="apellido" th:field="*{apellido}" class="form-control border-start-0 shadow-none py-2" placeholder="Tu apellido" required />
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold text-navy small">Correo Electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text bg-gray-light border-end-0 px-3"><i class="bi bi-envelope text-navy"></i></span>
                                <input type="email" id="email" th:field="*{email}" class="form-control border-start-0 shadow-none py-2" placeholder="nombre@ejemplo.com" required />
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold text-navy small">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-gray-light border-end-0 px-3"><i class="bi bi-key text-navy"></i></span>
                                <input type="password" id="password" th:field="*{password}" class="form-control border-start-0 border-end-0 shadow-none py-2" placeholder="••••••••" required />
                                <button class="btn btn-outline-secondary bg-gray-light border-start-0 text-navy px-3" type="button" id="togglePassword">
                                    <i class="bi bi-eye" id="toggleIcon"></i>
                                </button>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-12 col-md-6 mb-3">
                                <label for="dni" class="form-label fw-semibold text-navy small">DNI</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-gray-light border-end-0 px-3"><i class="bi bi-card-heading text-navy"></i></span>
                                    <input type="text" id="dni" th:field="*{dni}" maxlength="8" pattern="[0-9]{8}" class="form-control border-start-0 shadow-none py-2" placeholder="12345678" required />
                                </div>
                            </div>

                            <div class="col-12 col-md-6 mb-3">
                                <label for="telefono" class="form-label fw-semibold text-navy small">Teléfono</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-gray-light border-end-0 px-3"><i class="bi bi-telephone text-navy"></i></span>
                                    <!-- Validación agregada: exactamente 9 dígitos numéricos -->
                                    <input type="text"
                                           id="telefono"
                                           th:field="*{telefono}"
                                           maxlength="9"
                                           pattern="[0-9]{9}"
                                           class="form-control border-start-0 shadow-none py-2"
                                           placeholder="999999999"
                                           required />
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="departamentoSelect" class="form-label">Departamento</label>
                                <select class="form-select" id="departamentoSelect" name="departamento" required>
                                    <option value="">Seleccione Departamento</option>
                                </select>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label for="provinciaSelect" class="form-label">Provincia</label>
                                <select class="form-select" id="provinciaSelect" name="provincia" required disabled>
                                    <option value="">Seleccione Provincia</option>
                                </select>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label for="distritoSelect" class="form-label">Distrito</label>
                                <select class="form-select" id="distritoSelect" name="distrito" required disabled>
                                    <option value="">Seleccione Distrito</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="direccion" class="form-label">Dirección Exacta</label>
                            <input type="text" class="form-control" id="direccion" name="direccion"
                                   th:value="${usuario.direccion}" placeholder="Av. Los Incas 123, Dpto 402" required>
                        </div>

                        <div class="mb-3">
                            <label for="fechaNacimiento" class="form-label fw-semibold text-navy small">Fecha de Nacimiento</label>
                            <div class="input-group">
                                <span class="input-group-text bg-gray-light border-end-0 px-3"><i class="bi bi-calendar-date text-navy"></i></span>
                                <input type="date" id="fechaNacimiento" th:field="*{fechaNacimiento}" class="form-control border-start-0 shadow-none py-2" />
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="fileFoto" class="form-label fw-semibold text-navy small">Foto de Perfil</label>
                            <div class="input-group">
                                <span class="input-group-text bg-gray-light border-end-0 px-3"><i class="bi bi-image text-navy"></i></span>
                                <input type="file" id="fileFoto" name="fileFoto" accept="image/*" class="form-control border-start-0 shadow-none py-2" />
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-navy py-2.5 rounded-pill fw-semibold text-white shadow-sm">
                                <i class="bi bi-person-check-fill me-1"></i> Registrarse
                            </button>
                        </div>

                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <p class="text-muted small mb-0">
                            ¿Ya tienes una cuenta? <a th:href="@{/usuarios/login}" class="text-navy fw-semibold text-decoration-none">Inicia sesión aquí</a>
                        </p>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/login.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {

        const telefonoInput = document.getElementById('telefono');
        const dniInput = document.getElementById('dni');

        [telefonoInput, dniInput].forEach(input => {
            if (input) {
                input.addEventListener('input', (e) => {
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');
                });
            }
        });

        const depSelect = document.getElementById('departamentoSelect');
        const provSelect = document.getElementById('provinciaSelect');
        const distSelect = document.getElementById('distritoSelect');

        let provinciasData = {};
        let distritosData = {};

        // 1. Cargar el JSON de Departamentos
        fetch('/json/departamentos.json')
            .then(res => res.json())
            .then(data => {
                data.forEach(dep => {
                    const opt = document.createElement('option');
                    opt.value = dep.nombre_ubigeo;
                    opt.dataset.id = dep.id_ubigeo; // Guardamos el ID de Ubigeo para la cascada
                    opt.textContent = dep.nombre_ubigeo;
                    depSelect.appendChild(opt);
                });
            });

        // Pre-cargar los JSON de Provincias y Distritos
        fetch('/json/provincias.json')
            .then(res => res.json())
            .then(data => { provinciasData = data; });

        fetch('/json/distritos.json')
            .then(res => res.json())
            .then(data => { distritosData = data; });

        // 2. Al cambiar Departamento -> Cargar Provincias
        depSelect.addEventListener('change', function() {
            const selectedOption = this.options[this.selectedIndex];
            const depId = selectedOption.dataset.id;

            // Limpiar Provincias y Distritos
            provSelect.innerHTML = '<option value="">Seleccione Provincia</option>';
            distSelect.innerHTML = '<option value="">Seleccione Distrito</option>';
            distSelect.disabled = true;

            if (depId && provinciasData[depId]) {
                provinciasData[depId].forEach(prov => {
                    const opt = document.createElement('option');
                    opt.value = prov.nombre_ubigeo;
                    opt.dataset.id = prov.id_ubigeo;
                    opt.textContent = prov.nombre_ubigeo;
                    provSelect.appendChild(opt);
                });
                provSelect.disabled = false;
            } else {
                provSelect.disabled = true;
            }
        });

        // 3. Al cambiar Provincia -> Cargar Distritos
        provSelect.addEventListener('change', function() {
            const selectedOption = this.options[this.selectedIndex];
            const provId = selectedOption.dataset.id;

            distSelect.innerHTML = '<option value="">Seleccione Distrito</option>';

            if (provId && distritosData[provId]) {
                distritosData[provId].forEach(dist => {
                    const opt = document.createElement('option');
                    opt.value = dist.nombre_ubigeo;
                    opt.textContent = dist.nombre_ubigeo;
                    distSelect.appendChild(opt);
                });
                distSelect.disabled = false;
            } else {
                distSelect.disabled = true;
            }
        });
    });
</script>
</body>
</html>
