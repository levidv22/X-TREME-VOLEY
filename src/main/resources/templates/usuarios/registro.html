<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Voley Control</title>
    <link rel="icon" type="image/png" th:href="@{/img/logo.png}">

    <!-- Google Fonts & Bootstrap 5.3 -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/css/registro.css}">
</head>
<body class="bg-slate d-flex align-items-center justify-content-center min-vh-100 py-4 py-md-5">

<div class="container my-auto">
    <div class="row justify-content-center align-items-center">
        <div class="col-12 col-sm-11 col-md-10 col-lg-9 col-xl-8">

            <!-- Card Principal -->
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden animate-fade-in bg-white">

                <!-- Header de Registro con Degradado y Textura -->
                <div class="card-header bg-gradient-navy text-white p-4 p-md-5 text-center position-relative overflow-hidden border-0">
                    <div class="header-overlay position-absolute top-0 start-0 w-100 h-100"></div>
                    <div class="position-relative z-1">
                        <div class="brand-icon-box shadow-md rounded-circle mx-auto mb-3 bg-white text-navy d-flex align-items-center justify-content-center">
                            <i class="bi bi-person-plus-fill fs-2"></i>
                        </div>
                        <h2 class="fw-bold fs-3 mb-1 text-white">Crear una Cuenta</h2>
                        <p class="text-white-50 small mb-0 fs-6">Únete a la plataforma de gestión de Voley Control</p>
                    </div>
                </div>

                <div class="card-body p-3 p-sm-4 p-md-5">

                    <!-- Mensajes de Alerta -->
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show border-0 shadow-sm rounded-3 py-2.5 px-3 mb-4 small d-flex align-items-center" role="alert">
                        <i class="bi bi-exclamation-triangle-fill fs-5 me-2 flex-shrink-0"></i>
                        <div><span th:text="${error}"></span></div>
                        <button type="button" class="btn-close ms-auto my-auto" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm rounded-3 py-2.5 px-3 mb-4 small d-flex align-items-center" role="alert">
                        <i class="bi bi-check-circle-fill fs-5 me-2 flex-shrink-0"></i>
                        <div><span th:text="${exito}"></span></div>
                        <button type="button" class="btn-close ms-auto my-auto" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <!-- Formulario de Registro -->
                    <form th:action="@{/usuarios/registro}" th:object="${usuario}" method="post" enctype="multipart/form-data" class="needs-validation" novalidate>

                        <!-- Código de Referido (Si aplica) -->
                        <div class="mb-4" th:if="${!esPrimerUsuario}">
                            <div class="referral-badge-card p-3 rounded-3 border bg-light">
                                <label for="codigoReferidoIngresado" class="form-label fw-bold text-navy small mb-1">
                                    <i class="bi bi-ticket-perforated-fill me-1 text-primary"></i> Código de Referido / Patrocinador
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-key"></i></span>
                                    <input type="text" id="codigoReferidoIngresado" name="codigoReferidoIngresado" th:value="${codigoPrecargado}" class="form-control border-start-0" placeholder="Ingresa el código promocional o de tu patrocinador" required />
                                </div>
                            </div>
                        </div>

                        <!-- SECCIÓN 1: Datos de Acceso -->
                        <div class="form-section mb-4">
                            <div class="d-flex align-items-center gap-2 mb-3 pb-2 border-bottom">
                                <i class="bi bi-shield-lock-fill text-primary fs-5"></i>
                                <h6 class="fw-bold text-navy mb-0">Credenciales de Acceso</h6>
                            </div>

                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <label for="email" class="form-label fw-semibold text-secondary small">Correo Electrónico</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                                        <input type="email" id="email" th:field="*{email}" class="form-control border-start-0" placeholder="nombre@ejemplo.com" required />
                                    </div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="password" class="form-label fw-semibold text-secondary small">Contraseña</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                        <input type="password" id="password" th:field="*{password}" class="form-control border-start-0 border-end-0" placeholder="••••••••" required />
                                        <button class="btn btn-light border border-start-0 text-muted px-3" type="button" id="togglePassword" title="Mostrar/ocultar contraseña">
                                            <i class="bi bi-eye" id="toggleIcon"></i>
                                        </button>
                                    </div>
                                    <!-- Medidor visual de fortaleza de contraseña -->
                                    <div class="progress mt-2" style="height: 4px;">
                                        <div id="passwordMeter" class="progress-bar bg-danger" role="progressbar" style="width: 0%"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- SECCIÓN 2: Información Personal -->
                        <div class="form-section mb-4">
                            <div class="d-flex align-items-center gap-2 mb-3 pb-2 border-bottom">
                                <i class="bi bi-person-vcard-fill text-primary fs-5"></i>
                                <h6 class="fw-bold text-navy mb-0">Información Personal</h6>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-12 col-md-6">
                                    <label for="nombre" class="form-label fw-semibold text-secondary small">Nombre</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                                        <input type="text" id="nombre" th:field="*{nombre}" class="form-control border-start-0" placeholder="Ingresa tu nombre" required />
                                    </div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="apellido" class="form-label fw-semibold text-secondary small">Apellido</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person-fill"></i></span>
                                        <input type="text" id="apellido" th:field="*{apellido}" class="form-control border-start-0" placeholder="Ingresa tu apellido" required />
                                    </div>
                                </div>
                            </div>

                            <div class="row g-3">
                                <div class="col-12 col-md-4">
                                    <label for="dni" class="form-label fw-semibold text-secondary small">Documento (DNI)</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-card-heading"></i></span>
                                        <input type="text" id="dni" th:field="*{dni}" maxlength="8" pattern="[0-9]{8}" class="form-control border-start-0" placeholder="8 dígitos" required />
                                    </div>
                                </div>

                                <div class="col-12 col-md-4">
                                    <label for="telefono" class="form-label fw-semibold text-secondary small">Teléfono / Móvil</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-telephone"></i></span>
                                        <input type="text" id="telefono" th:field="*{telefono}" maxlength="9" pattern="[0-9]{9}" class="form-control border-start-0" placeholder="999999999" required />
                                    </div>
                                </div>

                                <div class="col-12 col-md-4">
                                    <label for="fechaNacimiento" class="form-label fw-semibold text-secondary small">Fecha Nacimiento</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-calendar-date"></i></span>
                                        <input type="date" id="fechaNacimiento" th:field="*{fechaNacimiento}" class="form-control border-start-0" />
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- SECCIÓN 3: Ubicación -->
                        <div class="form-section mb-4">
                            <div class="d-flex align-items-center gap-2 mb-3 pb-2 border-bottom">
                                <i class="bi bi-geo-alt-fill text-primary fs-5"></i>
                                <h6 class="fw-bold text-navy mb-0">Ubicación y Domicilio</h6>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-12 col-md-4">
                                    <label for="departamentoSelect" class="form-label fw-semibold text-secondary small">Departamento</label>
                                    <select class="form-select" id="departamentoSelect" name="departamento" required>
                                        <option value="">Seleccione Departamento</option>
                                    </select>
                                </div>

                                <div class="col-12 col-md-4">
                                    <label for="provinciaSelect" class="form-label fw-semibold text-secondary small">Provincia</label>
                                    <select class="form-select" id="provinciaSelect" name="provincia" required disabled>
                                        <option value="">Seleccione Provincia</option>
                                    </select>
                                </div>

                                <div class="col-12 col-md-4">
                                    <label for="distritoSelect" class="form-label fw-semibold text-secondary small">Distrito</label>
                                    <select class="form-select" id="distritoSelect" name="distrito" required disabled>
                                        <option value="">Seleccione Distrito</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row g-3">
                                <div class="col-12">
                                    <label for="direccion" class="form-label fw-semibold text-secondary small">Dirección Exacta</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-house-door"></i></span>
                                        <input type="text" class="form-control border-start-0" id="direccion" name="direccion" th:value="${usuario.direccion}" placeholder="Av. Los Incas 123, Dpto 402" required>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- SECCIÓN 4: Foto de Perfil Interactiva -->
                        <div class="form-section mb-4">
                            <div class="d-flex align-items-center gap-2 mb-3 pb-2 border-bottom">
                                <i class="bi bi-image-fill text-primary fs-5"></i>
                                <h6 class="fw-bold text-navy mb-0">Foto de Perfil <span class="text-muted fw-normal small">(Opcional)</span></h6>
                            </div>

                            <div class="d-flex align-items-center gap-3 p-3 rounded-3 border bg-light">
                                <div class="position-relative flex-shrink-0">
                                    <img id="avatarPreview" src="/img/default.jpg" th:src="@{/img/default.jpg}" alt="Vista previa" class="rounded-circle object-fit-cover border shadow-sm" width="65" height="65">
                                </div>
                                <div class="flex-grow-1">
                                    <label for="fileFoto" class="form-label fw-semibold text-navy small mb-1">Subir Imagen</label>
                                    <input type="file" id="fileFoto" name="fileFoto" accept="image/*" class="form-control form-control-sm" />
                                    <div class="form-text text-muted small mt-1">Formatos soportados: JPG, PNG o WEBP.</div>
                                </div>
                            </div>
                        </div>

                        <!-- Botón de Envío -->
                        <div class="d-grid mt-4 pt-2">
                            <button type="submit" class="btn btn-navy py-2.5 rounded-pill fw-bold text-white shadow-sm hover-lift d-flex align-items-center justify-content-center gap-2">
                                <i class="bi bi-person-check-fill fs-5"></i>
                                <span>Completar Registro</span>
                            </button>
                        </div>

                    </form>

                    <!-- Footer del Card -->
                    <div class="text-center mt-4 pt-3 border-top">
                        <p class="text-secondary small mb-0">
                            ¿Ya tienes una cuenta registrada?
                            <a th:href="@{/usuarios/login}" class="text-primary fw-bold text-decoration-none ms-1">
                                Inicia sesión aquí <i class="bi bi-arrow-right-short"></i>
                            </a>
                        </p>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/login.js}"></script>

<!-- Script Inline para Cascada Ubigeo (Manteniendo Lógica Exacta) -->
<script>
    document.addEventListener('DOMContentLoaded', () => {

        const telefonoInput = document.getElementById('telefono');
        const dniInput = document.getElementById('dni');

        [telefonoInput, dniInput].forEach(input => {
            if (input) {
                input.addEventListener('input', (e) => {
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');
                });
            }
        });

        const depSelect = document.getElementById('departamentoSelect');
        const provSelect = document.getElementById('provinciaSelect');
        const distSelect = document.getElementById('distritoSelect');

        let provinciasData = {};
        let distritosData = {};

        // 1. Cargar el JSON de Departamentos
        fetch('/json/departamentos.json')
            .then(res => res.json())
            .then(data => {
                data.forEach(dep => {
                    const opt = document.createElement('option');
                    opt.value = dep.nombre_ubigeo;
                    opt.dataset.id = dep.id_ubigeo; // Guardamos el ID de Ubigeo para la cascada
                    opt.textContent = dep.nombre_ubigeo;
                    depSelect.appendChild(opt);
                });
            })
            .catch(err => console.error("Error al cargar departamentos:", err));

        // Pre-cargar los JSON de Provincias y Distritos
        fetch('/json/provincias.json')
            .then(res => res.json())
            .then(data => { provinciasData = data; })
            .catch(err => console.error("Error al cargar provincias:", err));

        fetch('/json/distritos.json')
            .then(res => res.json())
            .then(data => { distritosData = data; })
            .catch(err => console.error("Error al cargar distritos:", err));

        // 2. Al cambiar Departamento -> Cargar Provincias
        depSelect.addEventListener('change', function() {
            const selectedOption = this.options[this.selectedIndex];
            const depId = selectedOption.dataset.id;

            // Limpiar Provincias y Distritos
            provSelect.innerHTML = '<option value="">Seleccione Provincia</option>';
            distSelect.innerHTML = '<option value="">Seleccione Distrito</option>';
            distSelect.disabled = true;

            if (depId && provinciasData[depId]) {
                provinciasData[depId].forEach(prov => {
                    const opt = document.createElement('option');
                    opt.value = prov.nombre_ubigeo;
                    opt.dataset.id = prov.id_ubigeo;
                    opt.textContent = prov.nombre_ubigeo;
                    provSelect.appendChild(opt);
                });
                provSelect.disabled = false;
            } else {
                provSelect.disabled = true;
            }
        });

        // 3. Al cambiar Provincia -> Cargar Distritos
        provSelect.addEventListener('change', function() {
            const selectedOption = this.options[this.selectedIndex];
            const provId = selectedOption.dataset.id;

            distSelect.innerHTML = '<option value="">Seleccione Distrito</option>';

            if (provId && distritosData[provId]) {
                distritosData[provId].forEach(dist => {
                    const opt = document.createElement('option');
                    opt.value = dist.nombre_ubigeo;
                    opt.textContent = dist.nombre_ubigeo;
                    distSelect.appendChild(opt);
                });
                distSelect.disabled = false;
            } else {
                distSelect.disabled = true;
            }
        });
    });
</script>
</body>
</html>
