<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente - Login</title>
    <link rel="icon" type="image/png" th:href="@{/img/logo.png}">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4 position-relative overflow-x-hidden">

<!-- Elementos de fondo dinámicos -->
<div class="bg-blur-orb orb-1"></div>
<div class="bg-blur-orb orb-2"></div>

<div class="container position-relative z-1">
    <div class="row justify-content-center align-items-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

            <div class="card main-card border-0 rounded-4 overflow-hidden shadow-custom animate-fade-in">

                <!-- Encabezado -->
                <div class="card-header bg-navy text-white text-center p-4 pt-5 border-0 position-relative">
                    <div class="verified-logo-wrapper mb-3">
                        <svg class="verified-shape" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                            <path d="M10.067.87a2.89 2.89 0 0 0-4.134 0l-.622.638-.89-.011a2.89 2.89 0 0 0-2.924 2.924l.01.89-.636.622a2.89 2.89 0 0 0 0 4.134l.637.622-.011.89a2.89 2.89 0 0 0 2.924 2.924l.89-.01.622.636a2.89 2.89 0 0 0 4.134 0l.622-.637.89.011a2.89 2.89 0 0 0 2.924-2.924l-.01-.89.636-.622a2.89 2.89 0 0 0 0-4.134l-.637-.622.011-.89a2.89 2.89 0 0 0-2.924-2.924l-.89.01zm.354 3.854a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 1 1 .708-.708L7 7.293l2.646-2.647a.5.5 0 0 1 .708 0"/>
                        </svg>
                        <img th:src="@{/img/logo.png}" alt="Logo" class="verified-logo-img">
                    </div>
                    <h4 class="fw-bold mb-1 tracking-tight">Bienvenido de nuevo</h4>
                    <p class="text-white-50 small mb-0">Inicia sesión para continuar en tu panel</p>
                </div>

                <!-- Cuerpo -->
                <div class="card-body p-4 p-md-5 bg-white">

                    <!-- Mensajes de alerta Thymeleaf -->
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show text-center py-2 px-3 mb-4 rounded-3 small border-0 shadow-sm" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show text-center py-2 px-3 mb-4 rounded-3 small border-0 shadow-sm" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${exito}"></span>
                        <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/usuarios/login}" method="post" class="needs-validation" novalidate>

                        <!-- Usuario -->
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold text-dark small mb-1">Correo o DNI</label>
                            <div class="input-group input-group-custom">
                                <span class="input-group-text"><i class="bi bi-person text-muted"></i></span>
                                <input type="text" id="username" name="username" class="form-control shadow-none" placeholder="ejemplo@correo.com o DNI" required />
                            </div>
                        </div>

                        <!-- Contraseña -->
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label for="password" class="form-label fw-semibold text-dark small mb-0">Contraseña</label>
                                <a th:href="@{/recuperar}" class="small text-navy text-decoration-none fw-medium link-hover">¿Olvidaste tu contraseña?</a>
                            </div>
                            <div class="input-group input-group-custom">
                                <span class="input-group-text"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" id="password" name="password" class="form-control shadow-none" placeholder="••••••••" required />
                                <button class="btn btn-toggle-password text-muted px-3" type="button" id="togglePassword">
                                    <i class="bi bi-eye" id="toggleIcon"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Botón Submit -->
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-navy py-2.5 rounded-3 fw-semibold text-white shadow-btn d-flex align-items-center justify-content-center gap-2">
                                <span>Iniciar Sesión</span>
                                <i class="bi bi-arrow-right short-arrow"></i>
                            </button>
                        </div>

                    </form>

                    <!-- Footer -->
                    <div class="text-center mt-4 pt-3 border-top">
                        <p class="text-muted small mb-0">
                            ¿No tienes una cuenta? <a th:href="@{/usuarios/registro}" class="text-navy fw-bold text-decoration-none link-hover">Regístrate aquí</a>
                        </p>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
