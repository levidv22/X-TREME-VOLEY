<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Voley Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-3 py-md-5">

<div class="container">
    <div class="row justify-content-center align-items-center">
        <!-- Uso de clases responsivas avanzadas para ajustar la tarjeta en móviles y PCs -->
        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-4">

            <div class="card shadow-lg border-0 rounded-4 overflow-hidden animate-fade-in w-100">

                <div class="card-header bg-navy text-white p-4 text-center">
                    <div class="mb-2">
                        <i class="bi bi-shield-lock-fill fs-1 text-white"></i>
                    </div>
                    <h3 class="mb-1 fw-bold fs-3">Bienvenido</h3>
                    <p class="text-gray-light mb-0 small">Inicia sesión para acceder a tu cuenta</p>
                </div>

                <div class="card-body p-3 p-sm-4 p-md-5 bg-white">

                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show text-center py-2 mb-3 shadow-sm rounded-3 small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${error}"></span>
                        <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show text-center py-2 mb-3 shadow-sm rounded-3 small" role="alert">
                        <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${exito}"></span>
                        <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/usuarios/login}" method="post" class="needs-validation" novalidate>

                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold text-navy small">Correo o DNI</label>
                            <div class="input-group">
                                <span class="input-group-text bg-gray-light border-end-0 px-3"><i class="bi bi-person text-navy"></i></span>
                                <input type="text" id="username" name="username" class="form-control border-start-0 shadow-none py-2" placeholder="Correo o DNI" required />
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold text-navy small">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-gray-light border-end-0 px-3"><i class="bi bi-key text-navy"></i></span>
                                <input type="password" id="password" name="password" class="form-control border-start-0 border-end-0 shadow-none py-2" placeholder="••••••••" required />
                                <button class="btn btn-outline-secondary bg-gray-light border-start-0 text-navy px-3" type="button" id="togglePassword">
                                    <i class="bi bi-eye" id="toggleIcon"></i>
                                </button>
                            </div>
                            <a th:href="@{/recuperar}" class="small text-decoration-none">¿Olvidaste tu contraseña?</a>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-navy py-2.5 rounded-pill fw-semibold text-white shadow-sm">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
                            </button>
                        </div>

                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <p class="text-muted small mb-0">
                            ¿No tienes una cuenta? <a th:href="@{/usuarios/registro}" class="text-navy fw-semibold text-decoration-none">Regístrate aquí</a>
                        </p>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
