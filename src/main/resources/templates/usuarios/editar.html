<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - Panel de Control</title>
    <link rel="icon" type="image/png" th:href="@{/img/logo.png}">

    <!-- Google Fonts & Bootstrap 5.3 -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/css/perfil-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/editar-perfil.css}">
</head>
<body class="bg-body-tertiary">

<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="main-content">
    <div th:replace="fragments/header :: header"></div>

    <div class="container-fluid p-3 p-md-4">
        <div class="row justify-content-center">
            <div class="col-12 col-xl-10">

                <!-- Cabecera de Página -->
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
                    <div class="d-flex align-items-center gap-3">
                        <div class="header-icon-box bg-primary bg-opacity-10 text-primary rounded-3 p-2.5 d-flex align-items-center justify-content-center">
                            <i class="bi bi-person-gear fs-3"></i>
                        </div>
                        <div>
                            <h2 class="fw-bold text-dark mb-0 fs-3">Editar Perfil</h2>
                            <p class="text-muted small mb-0">Gestiona y actualiza tu información personal y datos de contacto.</p>
                        </div>
                    </div>
                    <div>
                        <a th:href="@{/usuarios/perfil}" class="btn btn-outline-secondary rounded-pill px-3 py-2 fw-semibold small d-flex align-items-center gap-2 shadow-xs">
                            <i class="bi bi-arrow-left"></i> Cancelar y Volver
                        </a>
                    </div>
                </div>

                <!-- Tarjeta Contenedora Principal -->
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden animate-fade-in bg-white">

                    <!-- Banner Visual con Avatar Flotante -->
                    <div class="profile-edit-header p-4 p-md-5 position-relative text-center">
                        <div class="header-overlay position-absolute top-0 start-0 w-100 h-100"></div>
                        <div class="position-relative z-1">
                            <!-- Avatar con Upload Button Integrado -->
                            <div class="position-relative d-inline-block mx-auto mb-2">
                                <div class="avatar-edit-wrapper rounded-circle shadow-lg p-1 bg-white">
                                    <img id="previewImg"
                                         th:src="${usuario.fotoUrl != null && !usuario.fotoUrl.isEmpty() ? usuario.fotoUrl : '/img/default.jpg'}"
                                         alt="Foto de perfil"
                                         class="rounded-circle object-fit-cover avatar-preview-img" />
                                </div>
                                <label for="fileFoto" class="upload-badge-btn shadow-md" title="Cambiar foto de perfil">
                                    <i class="bi bi-camera-fill"></i>
                                </label>
                            </div>
                            <h5 class="text-white fw-bold mb-0" th:text="${usuario.nombre != null ? usuario.nombre + ' ' + usuario.apellido : 'Usuario'}">Usuario</h5>
                            <span class="badge bg-white bg-opacity-20 text-white rounded-pill px-3 py-1 small mt-2 fw-normal backdrop-blur">
                                <i class="bi bi-shield-check me-1"></i>Perfil de Usuario
                            </span>
                        </div>
                    </div>

                    <div class="card-body p-3 p-md-5">

                        <form th:action="@{/usuarios/actualizar}" th:object="${usuario}" method="post" enctype="multipart/form-data" class="needs-validation" novalidate>

                            <!-- MANTENER EXACTAMENTE IGUAL LA LÓGICA DE CAMPOS OCULTOS -->
                            <input type="hidden" th:field="*{id}" />
                            <input type="hidden" th:field="*{password}" />
                            <input type="hidden" th:field="*{rol}" />
                            <input type="hidden" th:field="*{tipoRed}" />
                            <input type="hidden" th:field="*{rangoActual}" />
                            <input type="hidden" th:field="*{activoMes}" />
                            <input type="hidden" th:field="*{fotoUrl}" />

                            <!-- Input file real (Oculto) -->
                            <input type="file" id="fileFoto" name="fileFoto" class="d-none" accept="image/*" />

                            <!-- Bloque 1: Datos Personales -->
                            <div class="section-block mb-4 pb-3 border-bottom">
                                <div class="d-flex align-items-center gap-2 mb-3">
                                    <i class="bi bi-person-vcard text-primary fs-5"></i>
                                    <h6 class="fw-bold text-dark mb-0">Información Personal</h6>
                                </div>

                                <div class="row g-3">
                                    <div class="col-12 col-md-6">
                                        <label for="nombre" class="form-label text-secondary small fw-semibold">Nombre</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                                            <input type="text" id="nombre" th:field="*{nombre}" class="form-control border-start-0" placeholder="Ingresa tu nombre" required />
                                        </div>
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label for="apellido" class="form-label text-secondary small fw-semibold">Apellido</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person-fill"></i></span>
                                            <input type="text" id="apellido" th:field="*{apellido}" class="form-control border-start-0" placeholder="Ingresa tu apellido" required />
                                        </div>
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label for="dni" class="form-label text-secondary small fw-semibold">Documento de Identidad (DNI)</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-card-heading"></i></span>
                                            <input type="text" id="dni" th:field="*{dni}" maxlength="8" class="form-control border-start-0" placeholder="8 dígitos" required />
                                        </div>
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label for="fechaNacimiento" class="form-label text-secondary small fw-semibold">Fecha de Nacimiento</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-calendar-event"></i></span>
                                            <input type="date" id="fechaNacimiento" name="fechaNacimiento"
                                                   th:value="${usuario.fechaNacimiento != null ? #temporals.format(usuario.fechaNacimiento, 'yyyy-MM-dd') : ''}"
                                                   class="form-control border-start-0" />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Bloque 2: Contacto -->
                            <div class="section-block mb-4 pb-3 border-bottom">
                                <div class="d-flex align-items-center gap-2 mb-3">
                                    <i class="bi bi-envelope-at text-primary fs-5"></i>
                                    <h6 class="fw-bold text-dark mb-0">Contacto Directo</h6>
                                </div>

                                <div class="row g-3">
                                    <div class="col-12 col-md-6">
                                        <label for="email" class="form-label text-secondary small fw-semibold">Correo Electrónico</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                                            <input type="email" id="email" th:field="*{email}" class="form-control border-start-0" placeholder="ejemplo@correo.com" required />
                                        </div>
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label for="telefono" class="form-label text-secondary small fw-semibold">Teléfono / Celular</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-telephone"></i></span>
                                            <input type="text" id="telefono" th:field="*{telefono}" class="form-control border-start-0" placeholder="+51 900 000 000" />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Bloque 3: Ubicación y Dirección -->
                            <div class="section-block mb-4">
                                <div class="d-flex align-items-center gap-2 mb-3">
                                    <i class="bi bi-geo-alt text-primary fs-5"></i>
                                    <h6 class="fw-bold text-dark mb-0">Ubicación y Residencia</h6>
                                </div>

                                <div class="row g-3">
                                    <div class="col-12 col-md-4">
                                        <label for="departamentoSelect" class="form-label text-secondary small fw-semibold">Departamento</label>
                                        <select class="form-select" id="departamentoSelect" th:field="*{departamento}" required>
                                            <option value="">Seleccione Departamento</option>
                                        </select>
                                    </div>

                                    <div class="col-12 col-md-4">
                                        <label for="provinciaSelect" class="form-label text-secondary small fw-semibold">Provincia</label>
                                        <select class="form-select" id="provinciaSelect" th:field="*{provincia}" required disabled>
                                            <option value="">Seleccione Provincia</option>
                                        </select>
                                    </div>

                                    <div class="col-12 col-md-4">
                                        <label for="distritoSelect" class="form-label text-secondary small fw-semibold">Distrito</label>
                                        <select class="form-select" id="distritoSelect" th:field="*{distrito}" required disabled>
                                            <option value="">Seleccione Distrito</option>
                                        </select>
                                    </div>

                                    <div class="col-12 mt-3">
                                        <label for="direccion" class="form-label text-secondary small fw-semibold">Dirección de Domicilio</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-house-door"></i></span>
                                            <input type="text" id="direccion" th:field="*{direccion}" class="form-control border-start-0" placeholder="Av., Calle, Nro., Mz., Lote" />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Botones de Acción -->
                            <div class="d-flex flex-column-reverse flex-sm-row justify-content-end gap-2 gap-md-3 mt-4 pt-3 border-top">
                                <a th:href="@{/usuarios/perfil}" class="btn btn-light text-secondary border px-4 py-2 rounded-pill fw-semibold text-center hover-lift">
                                    <i class="bi bi-x-circle me-1"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary px-4 py-2 rounded-pill fw-semibold shadow-sm text-center hover-lift">
                                    <i class="bi bi-check2-circle me-1"></i> Guardar Cambios
                                </button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/editar-perfil.js}"></script>

<!-- LÓGICA DE THYMELEAF Y CASCADA UBIGEO TOTALMENTE PRESERVADA -->
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', async () => {
        // 1. Obtener los valores que ya están guardados en la BD desde Thymeleaf
        const depGuardado = /*[[${usuario.departamento}]]*/ '';
        const provGuardado = /*[[${usuario.provincia}]]*/ '';
        const distGuardado = /*[[${usuario.distrito}]]*/ '';

        const depSelect = document.getElementById('departamentoSelect');
        const provSelect = document.getElementById('provinciaSelect');
        const distSelect = document.getElementById('distritoSelect');

        try {
            // 2. Cargar los 3 archivos JSON en paralelo
            const [resDep, resProv, resDist] = await Promise.all([
                fetch('/json/departamentos.json'),
                fetch('/json/provincias.json'),
                fetch('/json/distritos.json')
            ]);

            const departamentos = await resDep.json();
            const provinciasData = await resProv.json();
            const distritosData = await resDist.json();

            // 3. Poblar Departamentos
            departamentos.forEach(dep => {
                const opt = document.createElement('option');
                opt.value = dep.nombre_ubigeo;
                opt.dataset.id = dep.id_ubigeo;
                opt.textContent = dep.nombre_ubigeo;
                if (dep.nombre_ubigeo === depGuardado) {
                    opt.selected = true;
                }
                depSelect.appendChild(opt);
            });

            // 4. Si hay Departamento guardado, poblar y seleccionar Provincias
            if (depSelect.selectedIndex > 0) {
                const selectedDepOpt = depSelect.options[depSelect.selectedIndex];
                const depId = selectedDepOpt.dataset.id;

                if (depId && provinciasData[depId]) {
                    provSelect.innerHTML = '<option value="">Seleccione Provincia</option>';
                    provinciasData[depId].forEach(prov => {
                        const opt = document.createElement('option');
                        opt.value = prov.nombre_ubigeo;
                        opt.dataset.id = prov.id_ubigeo;
                        opt.textContent = prov.nombre_ubigeo;
                        if (prov.nombre_ubigeo === provGuardado) {
                            opt.selected = true;
                        }
                        provSelect.appendChild(opt);
                    });
                    provSelect.disabled = false;
                }
            }

            // 5. Si hay Provincia guardada, poblar y seleccionar Distritos
            if (provSelect.selectedIndex > 0) {
                const selectedProvOpt = provSelect.options[provSelect.selectedIndex];
                const provId = selectedProvOpt.dataset.id;

                if (provId && distritosData[provId]) {
                    distSelect.innerHTML = '<option value="">Seleccione Distrito</option>';
                    distritosData[provId].forEach(dist => {
                        const opt = document.createElement('option');
                        opt.value = dist.nombre_ubigeo;
                        opt.textContent = dist.nombre_ubigeo;
                        if (dist.nombre_ubigeo === distGuardado) {
                            opt.selected = true;
                        }
                        distSelect.appendChild(opt);
                    });
                    distSelect.disabled = false;
                }
            }

            // --- EVENT LISTENERS PARA EL CAMBIO MANUAL ---

            // Al cambiar Departamento manualmente
            depSelect.addEventListener('change', function() {
                const selectedOption = this.options[this.selectedIndex];
                const depId = selectedOption.dataset.id;

                provSelect.innerHTML = '<option value="">Seleccione Provincia</option>';
                distSelect.innerHTML = '<option value="">Seleccione Distrito</option>';
                distSelect.disabled = true;

                if (depId && provinciasData[depId]) {
                    provinciasData[depId].forEach(prov => {
                        const opt = document.createElement('option');
                        opt.value = prov.nombre_ubigeo;
                        opt.dataset.id = prov.id_ubigeo;
                        opt.textContent = prov.nombre_ubigeo;
                        provSelect.appendChild(opt);
                    });
                    provSelect.disabled = false;
                } else {
                    provSelect.disabled = true;
                }
            });

            // Al cambiar Provincia manualmente
            provSelect.addEventListener('change', function() {
                const selectedOption = this.options[this.selectedIndex];
                const provId = selectedOption.dataset.id;

                distSelect.innerHTML = '<option value="">Seleccione Distrito</option>';

                if (provId && distritosData[provId]) {
                    distritosData[provId].forEach(dist => {
                        const opt = document.createElement('option');
                        opt.value = dist.nombre_ubigeo;
                        opt.textContent = dist.nombre_ubigeo;
                        distSelect.appendChild(opt);
                    });
                    distSelect.disabled = false;
                } else {
                    distSelect.disabled = true;
                }
            });

        } catch (error) {
            console.error("Error al cargar las ubicaciones:", error);
        }
    });
</script>
</body>
</html>
