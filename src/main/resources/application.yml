spring:
  application:
    name: voley
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    #url: jdbc:mysql://localhost:3306/voley?serverTimezone=America/Lima&useSSL=TRUE
    url: ${MYSQLHOST}
    #username: root
    username: ${MYSQLUSER}
    #password: raticate2024
    password: ${MYSQLPASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

resend:
  api:
    #key: re_Scxq6QJA_6vtEsKWdvfZLfdUFju7c4wvr
    key: ${RESEND_API_KEY}

server:
  #port: 7000
  port: ${PORT}

logging:
  level:
    org.hibernate.sql: debug